name: CI

on:
  pull_request:

jobs:
  ci:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs lint / typecheck / test / vite build together
      - run: pnpm run build
      # Generated artifacts are committed, so ensure they stay in sync with their sources.
      # (git status catches both uncommitted changes and new files)
      - name: Check generated artifacts are in sync
        run: |
          if [ -n "$(git status --porcelain dist docs/methods.json)" ]; then
            git status --porcelain dist docs/methods.json
            echo "Generated artifacts are out of sync. Run 'pnpm run build' and commit them." >&2
            exit 1
          fi
