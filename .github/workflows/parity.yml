name: API parity

# Check the official Web API index and SDK bindings weekly.
on:
  schedule:
    - cron: '40 15 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  parity:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Compare tested routes with the Slack Web API index and Node SDK
        run: |
          status=0
          node scripts/check-parity.mjs > parity.txt || status=$?
          cat parity.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Report missing methods
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="New Slack API methods detected by the weekly parity check"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq '.[] | select(.title == "New Slack API methods detected by the weekly parity check") | .number' | head -n 1)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label enhancement --body-file parity.txt
          else
            gh issue edit "$existing" --body-file parity.txt
          fi
      - name: Fail the run when parity is broken
        if: steps.check.outputs.status != '0'
        run: exit 1
